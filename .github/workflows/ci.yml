# Builds Canvas and runs the unit tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: xcodebuild test -project Canvas.xcodeproj -scheme Canvas -destination 'platform=macOS' -quiet
