name: Monart
options:
  bundleIdPrefix: com.hunter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The released version; a release is published by pushing the tag v<this>.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Monart:
    type: application
    platform: macOS
    sources:
      - path: Monart
    settings:
      base:
        # Kept from when the app was called Canvas: the sandbox container (settings,
        # brush presets, autosaves) is tied to it.
        PRODUCT_BUNDLE_IDENTIFIER: com.hunter.Canvas
        PRODUCT_NAME: Monart
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Monart/Resources/Monart.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Monart/Resources/Info.plist
      properties:
        CFBundleDisplayName: Monart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: "© 2026 nhatientri. Free and open source under the MIT License."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Monart Drawing
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.hunter.monart
          # Drawings saved before the rename (.canvas).
          - CFBundleTypeName: Monart Drawing (Canvas)
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - com.hunter.canvas
          - CFBundleTypeName: PNG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
          - CFBundleTypeName: JPEG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.jpeg
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hunter.monart
            UTTypeDescription: Monart Drawing
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - monart
          - UTTypeIdentifier: com.hunter.canvas
            UTTypeDescription: Monart Drawing (Canvas)
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - canvas

  MonartTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MonartTests
    dependencies:
      - target: Monart
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Monart:
    build:
      targets:
        Monart: all
        MonartTests: [test]
    # Run the optimized build: pixel loops (fill, magic wand, brush) are 3–20× faster than
    # Debug. Tests still build Debug.
    run:
      config: Release
    test:
      config: Debug
      targets:
        - MonartTests
